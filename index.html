<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Zoek of jouw familie voorkomt in een archief van 57.330 voorouders uit Nederland, Duitsland en Frankrijk, van 1430 tot nu.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Herkomst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one white archive page. Toile engraving hero, ledger rows ruled with hairlines, one cobalt interlude, cobalt engraved footer. Single light theme by choice: blue ink on paper is the identity. */
:root{
  --paper:#FCFCFD;   /* page */
  --blue:#2A2BCF;    /* engraving ink, accents */
  --ink:#101015;     /* text */
  --muted:#6A6B7A;   /* secondary */
  --rule:#DCDDE6;    /* hairlines */
  --tint:#E5E6FC;    /* pill values */
  --display:"Libre Caslon Display","Didot","Bodoni 72",Georgia,serif;
  --text:"Libre Caslon Text",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* nav */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:16px;font-size:12px;letter-spacing:.02em}
.nav .links{display:flex;gap:20px}
.nav .links a{text-decoration:none}.nav .links a:hover{color:var(--blue)}
.brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--blue)}
.brand .wm{font-family:var(--display);font-size:13px;letter-spacing:.22em;text-transform:uppercase;line-height:1.1;margin-top:4px}
.brand svg{width:18px;height:auto}
.lang{display:flex;justify-content:flex-end;gap:2px}
.lang button{border:0;background:none;padding:4px 7px;font-size:12px;cursor:pointer;color:var(--muted);border-radius:3px}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
@media (max-width:720px){.nav{grid-template-columns:auto 1fr}.nav .links{display:none}.brand{align-items:flex-start}}

/* hero */
.hero{position:relative;height:clamp(640px,58vw,780px);border-top:1px solid var(--rule);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:34px}
.mono{width:46px;height:auto;filter:drop-shadow(0 0 6px var(--paper))}
.roman{font-family:var(--display);font-size:12px;letter-spacing:.2em;color:var(--blue);margin-top:10px;background:var(--paper);padding:0 6px}
.hero h1{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--blue);font-size:clamp(36px,6.2vw,84px);line-height:.98;letter-spacing:-.005em;
  margin:clamp(70px,11vw,150px) auto 0;max-width:12.5ch;text-wrap:balance;
  text-shadow:0 0 14px var(--paper),0 0 14px var(--paper),0 0 4px var(--paper)}
.searchbox{display:flex;width:min(520px,100%);margin-top:28px;border:1px solid var(--blue);background:var(--paper);border-radius:999px;overflow:hidden;box-shadow:0 0 0 10px color-mix(in srgb,var(--paper) 80%,transparent)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;padding:13px 20px;font-size:15px;outline:none}
.searchbox input::placeholder{color:var(--muted)}
.searchbox button{border:0;background:var(--blue);color:#fff;padding:0 22px;font-weight:500;cursor:pointer}
.loadhint{margin-top:10px;font-size:12px;color:var(--blue);background:var(--paper);padding:2px 8px;border-radius:4px}
.down{margin-top:14px;color:var(--blue);font-size:18px;text-decoration:none;background:var(--paper);border-radius:50%;width:28px;line-height:28px}
@media (max-width:600px){.hero{height:700px}}

/* intro */
.intro{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);align-items:center;padding-block:clamp(48px,7vw,96px) 0}
.intro canvas{width:100%;max-width:440px;height:300px;display:block}
.intro .copy{max-width:44ch;font-size:13.5px;display:grid;gap:14px}
.intro .copy p{margin:0}
.statement{padding-block:clamp(40px,6vw,80px) 0}
.statement p{font-size:clamp(22px,2.9vw,38px);line-height:1.22;letter-spacing:-.015em;font-weight:500;margin:0;max-width:30ch}
.statement .w{color:#B4B5C2;transition:color .25s}
.statement .w.on{color:var(--ink)}
.statement small{display:block;margin-top:12px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.strip{display:block;width:100%;height:150px;margin-top:20px}
@media (max-width:760px){.intro{grid-template-columns:1fr}.intro canvas{height:240px}}

/* section heads */
section.block{padding-block:clamp(48px,7vw,96px);border-top:1px solid var(--rule)}
.eyebrow{font-size:12px;color:var(--blue);margin:0 0 6px}
h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(36px,5.6vw,72px);line-height:.95;margin:0;text-wrap:balance}
h2 sup{font-family:var(--sans);font-size:.3em;color:var(--blue);vertical-align:1.4em;margin-left:6px}
.status{margin:14px 0 0;font-size:13px;color:var(--muted);max-width:60ch}

/* ledger rows */
.ledger{margin-top:28px;border-top:1px solid var(--rule)}
.row{text-decoration:none;color:inherit;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 28px;width:100%;padding:20px 0 18px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.row .nm{font-family:var(--display);text-transform:uppercase;font-size:clamp(30px,4.4vw,58px);line-height:.95;overflow-wrap:anywhere}
.row .nm em{font-style:normal;color:var(--muted)}
.row:hover .nm{color:var(--blue)}
.row .sub{grid-column:1;font-size:12.5px;margin-top:8px}
.row .side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:6px}
.kv{display:inline-flex;font-size:10.5px;line-height:1;white-space:nowrap}
.kv b{font-weight:500;background:var(--blue);color:#fff;padding:4px 5px}
.kv i{font-style:normal;background:var(--tint);color:var(--blue);padding:4px 6px}
.arrow{font-size:17px;color:var(--ink);margin-top:10px;line-height:1}
.row:hover .arrow{color:var(--blue)}
@media (max-width:600px){.row{grid-template-columns:1fr}.row .side{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-top:8px}.arrow{margin:0 0 0 auto}}
.more{margin-top:22px;font-family:var(--display);font-size:clamp(20px,2.4vw,28px);color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}

/* cobalt interlude */
.cobalt{position:relative;background:var(--blue);color:#fff;text-align:center;padding-block:clamp(90px,13vw,170px);overflow:hidden}
.cobalt canvas{position:absolute;width:clamp(170px,24vw,300px);height:clamp(170px,24vw,300px)}
.cobalt .c1{left:-10px;top:10px}.cobalt .c2{right:-10px;bottom:10px}
.cobalt .mono{filter:none}
.cobalt h2{position:relative;color:#fff;margin:22px auto 0;max-width:15ch;font-size:clamp(34px,5.4vw,70px)}
.cobalt h2 .l{opacity:.22;transition:opacity .5s}
.cobalt h2.go .l{opacity:1}

/* members */
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px 48px;align-items:start}
.feat .lead{font-family:var(--display);font-size:clamp(20px,2.2vw,26px);line-height:1.2;color:var(--blue);margin:0;max-width:24ch}
.feat .lead + p{font-size:13px;color:var(--ink);margin:14px 0 0;max-width:42ch}
.flist{border-top:1px solid var(--rule)}
.frow{padding:16px 0;border-bottom:1px solid var(--rule)}
.frow b{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(28px,3.6vw,46px);line-height:1}
.frow:nth-child(n+4) b{color:#9A9BAA}
.frow span{display:block;font-size:12.5px;margin-top:6px;color:var(--muted)}
.tagbtn{display:inline-block;margin-top:22px;background:var(--blue);padding:1px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);border:0;cursor:pointer;text-decoration:none}
.tagbtn span{display:block;background:var(--paper);color:var(--blue);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:12px 28px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.tagbtn:hover span{background:var(--tint)}
.contact{margin-top:14px;font-size:12.5px;color:var(--muted);max-width:44ch}
@media (max-width:760px){.feat{grid-template-columns:1fr}}

/* privacy: three testimonies */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:30px}
.three article{border-top:1px solid var(--rule);padding-top:12px}
.three h3{font-size:12px;font-weight:600;margin:0}
.three .s{font-size:10.5px;color:var(--blue);margin-top:2px}
.three p{font-family:var(--text);font-size:clamp(18px,1.7vw,22px);line-height:1.28;margin:18px 0 0}
@media (max-width:820px){.three{grid-template-columns:1fr}}

/* archive notes (press style) */
.notes{margin-top:26px;border-top:1px solid var(--rule)}
.note{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:20px;align-items:start;padding:16px 0;border-bottom:1px solid var(--rule)}
.note .k{font-family:var(--display);font-size:22px;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.note h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,32px);line-height:1.08;margin:0}
.note .m{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:10.5px;color:var(--blue)}
.note .m:before{content:"";order:1;width:34px;height:1px;background:var(--blue)}
.note .m span:last-child{order:2}
@media (max-width:600px){.note{grid-template-columns:1fr}}

/* footer */
footer{background:var(--blue);color:#fff;position:relative}
footer canvas{display:block;width:100%;height:clamp(220px,26vw,340px)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-block:6px 30px}
.foot .wm{font-family:var(--display);font-size:clamp(28px,4vw,46px);line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.foot .wm small{display:block;font-size:12px;letter-spacing:.2em;margin-bottom:6px}
.foot nav{display:flex;gap:18px;font-size:12px}
.foot nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.statement .w,.cobalt h2 .l{transition:none}}
</style>

  <header class="nav">
    <nav class="links" aria-label="Menu">
      <a href="#zoeken" data-t="navSearch"></a><a href="#leden" data-t="navMembers"></a><a href="#over" data-t="navAbout"></a><a href="#privacy" data-t="navPrivacy"></a>

    </div>

</div>

  <canvas id="cvHero" aria-hidden="true"></canvas>
  <div class="hero-in wrap">
    <svg class="mono" viewBox="0 0 68 104" aria-hidden="true"><path d="M0 104V48C0 26 15 9 34 0C53 9 68 26 68 48V104Z" fill="var(--blue)"/><g fill="none" stroke="var(--paper)" stroke-width="4.4" stroke-linecap="round"><path d="M34 88V52"/><path d="M34 64C26 58 20 50 18 40"/><path d="M34 64C42 58 48 50 50 40"/><path d="M34 54C29 46 27 38 28 28"/><path d="M34 54C39 46 41 38 40 28"/><path d="M34 88C28 92 20 95 12 96"/><path d="M34 88C40 92 48 95 56 96"/></g></svg>

      <input id="q" type="search" autocomplete="off" data-tp="searchPh" aria-label="">
      <button type="submit" data-t="searchBtn"></button>
    </form>

    <a class="down" href="#over" aria-label="↓">↓</a>
  </div>
</div>

<div class="wrap" id="over">
  <div class="intro">
    <canvas id="cvBird" aria-hidden="true"></canvas>
    <div class="copy"><p data-t="intro1"></p><p data-t="intro2"></p><p data-t="intro3"></p></div>
  </div>

</div>
<canvas class="strip" id="cvStrip" aria-hidden="true"></canvas>

<section class="block" id="zoeken"><div class="wrap">
  <h2><span data-t="regTitle"></span><sup>↗</sup></h2>

</div>

  <div>
    <p class="eyebrow" data-t="memEyebrow"></p>
    <p class="lead" data-t="memLead"></p>
    <p data-t="memNote"></p>
    <a class="tagbtn" href="#aanvragen" id="reqBtn"><span data-t="memCta"></span></a>
    <p class="contact" id="aanvragen" data-t="memContact"></p>
  </div>
  <div class="flist" id="flist"></div>
</div></section>

<section class="block" id="privacy"><div class="wrap">
  <h2><span data-t="privTitle"></span><sup>↗</sup></h2>
  <p class="status" data-t="privSub"></p>
  <div class="three" id="three"></div>
</div></section>

</div></section>

<footer>
  <canvas id="cvFoot" aria-hidden="true"></canvas>

  </div>
</footer>

<script>
/* Toile engraving engine: draws copper-plate style line art (leaves, roses, trees, arches, villages, birds) on a canvas. */
(function(){
"use strict";
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const TAU=Math.PI*2;
function q(p0,p1,p2,t){ const u=1-t; return [u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]; }

function engraver(ctx, fg, bg, seed){
  const R=rng(seed), rr=(a,b)=>a+R()*(b-a);
  ctx.lineCap="round"; ctx.lineJoin="round";
  const st=(w)=>{ ctx.strokeStyle=fg; ctx.fillStyle=bg; ctx.lineWidth=w; };
  const E={R,rr,ctx};

  function hatch(clipPath, angle, gap, lw, box){
    ctx.save(); ctx.beginPath(); clipPath(); ctx.clip();
    const [x0,y0,x1,y1]=box, cx=(x0+x1)/2, cy=(y0+y1)/2, r=Math.hypot(x1-x0,y1-y0)/2+2;
    const ca=Math.cos(angle), sa=Math.sin(angle);
    ctx.lineWidth=lw; ctx.strokeStyle=fg; ctx.beginPath();
    for(let d=-r; d<=r; d+=gap){ ctx.moveTo(cx-ca*r-sa*d, cy-sa*r+ca*d); ctx.lineTo(cx+ca*r-sa*d, cy+sa*r+ca*d); }
    ctx.stroke(); ctx.restore();
  }
  E.hatch=hatch;

  E.leaf=(x,y,L,a,lw=1)=>{
    const W=L*rr(.26,.36), ca=Math.cos(a), sa=Math.sin(a), bend=rr(-.12,.12)*L;
    const P=(u,v)=>[x+ca*u-sa*v, y+sa*u+ca*v];
    const b=[x,y], tip=P(L,bend), c1=P(L*.45,W+bend*.5), c2=P(L*.45,-W+bend*.5), m=P(L*.5,bend*.5);
    st(lw); ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(c1[0],c1[1],tip[0],tip[1]); ctx.quadraticCurveTo(c2[0],c2[1],x,y); ctx.fill(); ctx.stroke();
    ctx.lineWidth=lw*.75; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(m[0],m[1],tip[0],tip[1]); ctx.stroke();
    ctx.lineWidth=lw*.5; ctx.beginPath();
    for(let t=.1;t<.92;t+=.06){ const p=q(b,m,tip,t), e=q(b,c2,tip,Math.min(1,t+.07)); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]+(e[0]-p[0])*.9, p[1]+(e[1]-p[1])*.9); }
    for(let t=.2;t<.85;t+=.18){ const p=q(b,m,tip,t), e=q(b,c1,tip,Math.min(1,t+.1)); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]+(e[0]-p[0])*.75, p[1]+(e[1]-p[1])*.75); }
    ctx.stroke();
  };

  E.rose=(x,y,r,lw=1)=>{
    st(lw); const n=6+Math.floor(R()*3), a0=R()*TAU;
    for(let k=0;k<n;k++){
      const a=a0+k*TAU/n+rr(-.2,.2), px=x+Math.cos(a)*r*.55, py=y+Math.sin(a)*r*.48, pr=r*rr(.42,.54);
      st(lw); ctx.beginPath(); ctx.ellipse(px,py,pr,pr*.78,a,0,TAU); ctx.fill(); ctx.stroke();
      ctx.lineWidth=lw*.5; ctx.beginPath();
      for(let j=0;j<5;j++){ const aa=a+Math.PI+(j-2)*.22; ctx.moveTo(px+Math.cos(aa)*pr*.25,py+Math.sin(aa)*pr*.2); ctx.lineTo(px+Math.cos(aa)*pr*.8,py+Math.sin(aa)*pr*.62); }
      ctx.stroke();
    }
    st(lw); ctx.beginPath(); ctx.ellipse(x,y,r*.5,r*.42,0,0,TAU); ctx.fill(); ctx.stroke();
    ctx.lineWidth=lw*.8; ctx.beginPath();
    for(let t=0;t<15;t+=.12){ const rad=r*.44*(1-t/15), px=x+Math.cos(t)*rad, py=y+Math.sin(t)*rad*.82; t?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke();
  };

  E.daisy=(x,y,r,lw=1)=>{
    const n=14+Math.floor(R()*5), a0=R()*TAU;
    for(let k=0;k<n;k++){ const a=a0+k*TAU/n, px=x+Math.cos(a)*r*.56, py=y+Math.sin(a)*r*.56;
      st(lw); ctx.beginPath(); ctx.ellipse(px,py,r*.44,r*.12,a,0,TAU); ctx.fill(); ctx.stroke();
      ctx.lineWidth=lw*.45; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*.25,y+Math.sin(a)*r*.25); ctx.lineTo(x+Math.cos(a)*r*.85,y+Math.sin(a)*r*.85); ctx.stroke(); }
    st(lw); ctx.beginPath(); ctx.arc(x,y,r*.26,0,TAU); ctx.fill(); ctx.stroke();

const LOC={nl:"nl-NL",de:"de-DE",fr:"fr-FR",en:"en-GB"};
let lang="nl";
try{ const s=localStorage.getItem("herkomst-lang"); if(T[s]) lang=s; else { const b=(navigator.language||"nl").slice(0,2); if(T[b]) lang=b; } }catch(e){ const b=(navigator.language||"nl").slice(0,2); if(T[b]) lang=b; }
const t=(k,v={})=>String(T[lang][k]??T.nl[k]).replace(/\{(\w+)\}/g,(m,x)=>v[x]??m);
const fmt=n=>new Intl.NumberFormat(LOC[lang]).format(n);
function roman(n){ const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let s=""; for(const [v,r] of m) while(n>=v){s+=r;n-=v;} return s; }
function century(c){ if(!c) return t("rowNoDate");
  return lang==="nl"?`${c}e eeuw`:lang==="de"?`${c}. Jahrhundert`:lang==="fr"?`${roman(c)}e siècle`:`${c}${c%100>10&&c%100<14?"th":({1:"st",2:"nd",3:"rd"}[c%10]||"th")} century`; }
function centRange(a,b){ if(!a) return t("rowNoDate"); if(a===b) return century(a);
  return lang==="fr"?`${roman(a)}e – ${roman(b)}e s.`:lang==="de"?`${a}. – ${b}. Jh.`:lang==="nl"?`${a}e – ${b}e eeuw`:`${century(a).split(" ")[0]} – ${century(b)}`; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- data ---------------- */
let D=null, IDX=[], SUR=[], hits=[], shown=0, query="";
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function personRow(i){
  const p=D.p[i]; const nm=[p[0]?esc(p[0]):"",p[1]?`<em>${esc(p[1])}</em>`:"",esc(p[2]||"")].filter(Boolean).join(" ")||"—";
  return `<a class="row" href="#leden"><span class="nm">${nm}</span><span class="sub">${t("rowSub")} · ${esc(century(p[3]))}</span>
   <span class="side"><span class="kv"><b>${t("kvIn")}</b><i>${t("kvYes")}</i></span><span class="kv"><b>${t("kvPeriod")}</b><i>${esc(century(p[3]))}</i></span><span class="kv"><b>${t("kvDetails")}</b><i>${t("kvMembers")}</i></span><span class="arrow">↗</span></span></a>`;
}
function surnameRow(s){
  return `<button class="row" data-s="${esc(s.name)}"><span class="nm">${esc(s.name)}</span><span class="sub">${t("famSub",{n:fmt(s.n)})}</span>
   <span class="side"><span class="kv"><b>${t("kvPersons")}</b><i>${fmt(s.n)}</i></span><span class="kv"><b>${t("kvPeriod")}</b><i>${esc(centRange(s.a,s.b))}</i></span><span class="arrow">↗</span></span></button>`;
}
function search(q){
  const words=norm(q).split(/\s+/).filter(Boolean); if(!words.length) return [];
  const out=[]; for(let i=0;i<IDX.length;i++){ const s=IDX[i]; if(words.every(w=>s.includes(w))) out.push(i); }
  out.sort((a,b)=>{ const ea=words.some(w=>norm(D.p[a][2])===w)?0:1, eb=words.some(w=>norm(D.p[b][2])===w)?0:1; return ea-eb || (D.p[a][3]||99)-(D.p[b][3]||99) || D.p[a][0].localeCompare(D.p[b][0]); });
  return out;
}
function renderRegister(reset=true){
  const box=$("#results"), st=$("#status");
  if(!D){ st.textContent=query?t("regWait"):t("regIdle"); return; }
  if(!query.trim()){ st.textContent=t("regIdle"); box.innerHTML=SUR.slice(0,8).map(surnameRow).join(""); $("#moreBtn").hidden=true; return; }
  if(reset){ hits=search(query); shown=0; box.innerHTML=""; }
  st.textContent = hits.length===0?t("regNone",{q:query.trim()}):hits.length===1?t("regOne",{q:query.trim()}):t("regFound",{n:fmt(hits.length),q:query.trim()});
  const next=hits.slice(shown,shown+30); box.insertAdjacentHTML("beforeend",next.map(personRow).join("")); shown+=next.length;
  $("#moreBtn").hidden = shown>=hits.length;
}
let deb=null;
$("#q").addEventListener("input",e=>{ clearTimeout(deb); deb=setTimeout(()=>{ query=e.target.value; renderRegister(); },180); });
$("#heroForm").addEventListener("submit",e=>{ e.preventDefault(); query=$("#q").value; renderRegister(); $("#zoeken").scrollIntoView(); });
$("#moreBtn").addEventListener("click",()=>renderRegister(false));
document.addEventListener("click",e=>{ const r=e.target.closest(".row[data-s]"); if(r){ $("#q").value=r.dataset.s; query=r.dataset.s; renderRegister(); $("#zoeken").scrollIntoView(); } });

/* ---------------- static copy ---------------- */
function splitWords(el,txt){ el.innerHTML=txt.split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(" "); }
function splitLetters(el,txt){ let i=0; el.innerHTML=txt.split(/(\s+)/).map(part=>/^\s+$/.test(part)?" ":`<span style="white-space:nowrap">${[...part].map(ch=>`<span class="l" style="transition-delay:${(i++)*28}ms">${esc(ch)}</span>`).join("")}</span>`).join(""); }
function notesHTML(){
  if(!D) return "";
  const top=SUR[0]||{name:"",n:0};
  return T[lang].notes.map((n,ix)=>{ const v={n:fmt(D.n),f:fmt(D.fam),s:top.name,c:fmt(top.n),k:fmt(SUR.length)};
    const k=[ "1430", fmt(D.n), fmt(top.n), fmt(SUR.length) ][ix];
    return `<div class="note"><div class="k">${k}</div><div><h3>${esc(n[0].replace(/\{(\w+)\}/g,(m,x)=>v[x]??m))}</h3><div class="m"><span>${esc(n[1])}</span><span>${esc(n[2].replace(/\{(\w+)\}/g,(m,x)=>v[x]??m))}</span></div></div><a class="arrow" href="#zoeken" aria-label="${esc(t("navSearch"))}">↗</a></div>`; }).join("");
}
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.dataset.t, D?{n:fmt(D.n)}:{}); });
  $("#q").placeholder=t("searchPh"); $("#q").setAttribute("aria-label",t("searchPh"));
  if(D) $("#loadHint").textContent=t("loaded",{n:fmt(D.n)});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  splitWords($("#stmt"),t("stmt")); reveal();
  const ch=$("#cobaltH"); const went=ch.classList.contains("go"); splitLetters(ch,t("cobaltH")); if(went) ch.classList.add("go");
  $("#flist").innerHTML=T[lang].feats.map(f=>`<div class="frow"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join("");
  $("#three").innerHTML=T[lang].three.map(c=>`<article><h3>${esc(c[0])}</h3><div class="s">${esc(c[1])}</div><p>${esc(c[2])}</p></article>`).join("");
  $("#notes").innerHTML=notesHTML();
  renderRegister();
}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.l; try{localStorage.setItem("herkomst-lang",lang);}catch(e){} applyLang(); }));

/* ---------------- scroll effects ---------------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function reveal(){
  const p=$("#stmt"), ws=p.querySelectorAll(".w"); if(!ws.length) return;
  if(reduce){ ws.forEach(w=>w.classList.add("on")); return; }
  const r=p.getBoundingClientRect(), vh=innerHeight;
  const prog=Math.max(0,Math.min(1,(vh*.85-r.top)/(r.height+vh*.35)));
  const k=Math.round(prog*ws.length); ws.forEach((w,i)=>w.classList.toggle("on",i<k));
}
addEventListener("scroll",reveal,{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("go"); io.unobserve(e.target); } }),{threshold:.4});
if(reduce) $("#cobaltH").classList.add("go"); else io.observe($("#cobaltH"));

/* ---------------- engravings ---------------- */
const BLUE="#2A2BCF", PAPER="#FCFCFD", WHITE="#FFFFFF";
function drawHero(){
  const cv=$("#cvHero"); const {ctx,w,h}=Toile.fit(cv); ctx.clearRect(0,0,w,h);
  const E=Toile.engraver(ctx,BLUE,PAPER,1430), s=Math.max(.55,Math.min(1.2,w/1250)), lw=Math.max(.75,s*.95), gy=h*.9;
  if(w>560){ E.ground(w*.56,w*.80,h*.80,4,h*.84,lw,{rows:3,pebbles:0}); E.village(w*.66,h*.80,20*s,lw); }
  E.ground(-10,w+10,gy,7*s,h+20,lw,{rows:7,pebbles:12});
  E.rock(w*.9,gy+6,220*s,64*s,lw);
  E.tree(w*.9,gy-46*s,Math.min(h*.66,560*s),lw);
  E.arch(w*.015,gy+4,Math.max(110,175*s),Math.min(h*.66,500*s),lw);
  E.bush(w*.03,gy+10,150*s,100*s,{lw,leaf:s});
  E.bush(w*.23,gy+10,190*s,130*s,{lw,leaf:s});
  E.bush(w*.41,gy+12,150*s,64*s,{lw,leaf:s,flowers:2,daisy:true});
  E.bush(w*.59,gy+12,170*s,78*s,{lw,leaf:s,flowers:2});
  E.bush(w*.76,gy+12,150*s,96*s,{lw,leaf:s,daisy:true});
  const mx=w/2, gw=Math.min(300*s,w*.3);
  E.garland(mx-34-gw,22*s,mx-38,58,46*s,lw,{n:14,flowers:2,s});
  E.garland(mx+38,58,mx+34+gw,22*s,46*s,lw,{n:14,flowers:2,s});
  E.bird(w*.13,h*.19,1.7*s,-.18,false,lw);
  E.bird(w*.80,h*.13,1.05*s,.12,true,lw);
  E.bird(w*.74,h*.20,.8*s,.05,true,lw);
  E.butterfly(w*.30,h*.40,1.3*s,.35,lw);
  E.butterfly(w*.68,h*.50,1.1*s,-.4,lw);
}
function drawBird(){
  const {ctx,w,h}=Toile.fit($("#cvBird")); ctx.clearRect(0,0,w,h);
  const E=Toile.engraver(ctx,BLUE,PAPER,1648), s=Math.min(1,w/440);
  E.branch(10,h*.82,w*.95,h*.42,1,{s,flowers:2});
  E.bird(w*.55,h*.36,1.5*s,-.08,false,1);
  E.butterfly(w*.2,h*.2,1.2*s,.4,1);
}
function drawStrip(){
  const {ctx,w,h}=Toile.fit($("#cvStrip")); ctx.clearRect(0,0,w,h);
  const E=Toile.engraver(ctx,BLUE,PAPER,1720), s=Math.max(.6,Math.min(1,w/1250));
  E.ground(-10,w+10,h*.86,3,h+10,.9,{rows:3,pebbles:6});
  const n=Math.max(3,Math.round(w/260));
  for(let i=0;i<n;i++){ const x=(i+.5)*w/n+E.rr(-30,30); E.bush(x,h*.9,E.rr(90,150)*s,E.rr(50,90)*s,{lw:.9,leaf:s,flowers:1,daisy:i%2===0}); }
}
function drawCorner(id,seed,flip){
  const cv=$(id); const {ctx,w,h}=Toile.fit(cv); ctx.clearRect(0,0,w,h);
  const E=Toile.engraver(ctx,WHITE,BLUE,seed), s=w/300;
  ctx.save(); if(flip){ ctx.translate(w,h); ctx.rotate(Math.PI); }
  E.bush(w*.35,h*.82,w*.6,h*.62,{lw:.9,leaf:s*.9,flowers:3});
  E.bud(w*.75,h*.3,6*s,-.5,.9); E.butterfly(w*.72,h*.18,1*s,.3,.9);
  ctx.restore();
}
function drawFoot(){
  const {ctx,w,h}=Toile.fit($("#cvFoot")); ctx.clearRect(0,0,w,h);
  const E=Toile.engraver(ctx,WHITE,BLUE,2025), s=Math.max(.55,Math.min(1.1,w/1250)), gy=h*.9;
  E.ground(w*.25,w*.75,h*.66,4,h*.7,.9,{rows:3,pebbles:0});
  E.village(w*.45,h*.66,24*s,.9);
  E.ground(-10,w+10,gy,6*s,h+10,.9,{rows:5,pebbles:10});
  E.tree(w*.14,gy-10,h*.86,.9);
  E.tree(w*.84,gy-14,h*.74,.9);
  E.arch(w*.62,gy+4,90*s,h*.5,.9);
  E.bush(w*.30,gy+8,170*s,80*s,{lw:.9,leaf:s});
  E.bush(w*.52,gy+8,140*s,60*s,{lw:.9,leaf:s,daisy:true});
  E.bush(w*.96,gy+8,150*s,90*s,{lw:.9,leaf:s});
  E.bird(w*.35,h*.22,1.1*s,-.1,false,.9); E.bird(w*.72,h*.18,.8*s,.1,true,.9);
}
function drawAll(){ drawHero(); drawBird(); drawStrip(); drawCorner("#cvC1",11,false); drawCorner("#cvC2",29,true); drawFoot(); }
let rz=null, lastW=innerWidth;
addEventListener("resize",()=>{ if(Math.abs(innerWidth-lastW)<2) return; lastW=innerWidth; clearTimeout(rz); rz=setTimeout(drawAll,200); });
drawAll();

/* ---------------- load ---------------- */
applyLang();
fetch("data.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  D=d; IDX=d.p.map(p=>norm(p[0]+" "+p[1]+" "+p[2]));
  const m=new Map(); for(const p of d.p){ const s=(p[2]||"").trim(); if(!s) continue; const k=s.toLowerCase(); let e=m.get(k); if(!e){e={name:s,n:0,a:0,b:0};m.set(k,e);} e.n++; if(p[3]){ e.a=e.a?Math.min(e.a,p[3]):p[3]; e.b=Math.max(e.b,p[3]); } }
  SUR=[...m.values()].sort((a,b)=>b.n-a.n);
  if($("#q").value.trim()) query=$("#q").value;
  applyLang();
}).catch(()=>{ $("#loadHint").textContent=t("loadFail"); });
})();
</script>
